name: Android release

# Manual only, on purpose: the upload keystore is release authority. Nothing in
# this workflow runs on push or pull_request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Signed AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the compile SDK
        run: sdkmanager --install "platforms;android-36"

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_B64}" ]; then
            echo "ANDROID_KEYSTORE_B64 is not set; refusing to build an unsigned release." >&2
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/upload.jks"

      - name: Build the signed bundle and APK
        working-directory: android-twa
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Print the signing certificate SHA-256
        run: |
          set -euo pipefail
          keytool -printcert -jarfile android-twa/app/build/outputs/bundle/release/app-release.aab \
            | grep -E 'SHA256|Owner' || true

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baanzon-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android-twa/app/build/outputs/bundle/release/app-release.aab
            android-twa/app/build/outputs/apk/release/app-release.apk
