# Build — the packages and the client bundle.
#
# This is a compile smoke gate, not a typecheck: `tsdown` emits without checking
# types for packages/api, packages/client and packages/data-schemas, and Vite does
# not typecheck at all. Type errors are caught by typecheck.yml.

name: Build

on:
  pull_request:
    # Every pull request, whatever the base: see the note in static-checks.yml.
  push:
    branches:
      - b1
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build:packages && build:client
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc # 24.16.0
          cache: npm
          # package-lock.json is the lockfile of record (packageManager npm@11.13.0).
          # bun.lock is also tracked — known issue P1-10.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # build:packages = data-provider -> data-schemas -> api -> client-package,
      # in dependency order (root package.json). Split into two steps so the log
      # names which half failed.
      - name: Build the workspace packages
        run: npm run build:packages

      - name: Build the client
        # The client build is the memory-hungry half: `cd client && npm run build`
        # is `vite build` with NODE_OPTIONS=--max-old-space-size=8192 (client/package.json).
        # ubuntu-latest runners have 16 GB, so that ceiling is safe here.
        run: npm run build:client
