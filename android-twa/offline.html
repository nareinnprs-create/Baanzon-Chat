<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baanzon Chat — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #303438;
        color: #e8eaed;
        font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      main { max-width: 420px; }
      .orb {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #5b8cff, #303438 70%);
        opacity: 0.9;
      }
      h1 { font-size: 1.25rem; margin: 0 0 8px; font-weight: 600; }
      p { font-size: 0.9rem; color: #b8bcc2; margin: 0 0 20px; line-height: 1.5; }
      button {
        background: #5b8cff;
        color: #fff;
        border: 0;
        border-radius: 24px;
        padding: 10px 28px;
        font-size: 0.9rem;
        font-weight: 600;
      }
      button:active { opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <h1>You're offline</h1>
      <p>Baanzon Chat needs a connection. Check your network and try again — your conversations are safe.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
